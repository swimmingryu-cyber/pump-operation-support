<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>消防ポンプ運用支援 v0.9.17</title>
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=0917">
</head>
<body>
  <main class="shell" id="main">
    <header class="top">
      <strong>消防ポンプ運用支援 <small>v0.9.17</small></strong>
      <button id="reset" type="button">初期化</button>
      <button id="flip" type="button" aria-pressed="false">⇄ 左右反転</button>
    </header>
    <div class="deck" id="deck">
      <section class="vehicle" aria-label="消防車とポンプ">
        <div class="map" id="map">
          <svg viewBox="0 0 300 192" preserveAspectRatio="none" aria-hidden="true" id="hoses">
            <path data-hose="left-rear" d="M72 61V36Q72 24 86 24H300"/>
            <path data-hose="left-front" d="M144 61V53Q144 45 156 45H300"/>
            <path data-hose="right-front" d="M144 131V139Q144 147 156 147H300"/>
            <path data-hose="right-rear" d="M72 131V156Q72 168 86 168H300"/>
            <g class="pump-truck">
              <rect x="43" y="57" width="38" height="16" rx="4" fill="#070f1b"/>
              <rect x="43" y="119" width="38" height="16" rx="4" fill="#070f1b"/>
              <rect x="150" y="57" width="35" height="16" rx="4" fill="#070f1b"/>
              <rect x="150" y="119" width="35" height="16" rx="4" fill="#070f1b"/>
              <rect x="44" y="73" width="85" height="46" rx="6" fill="#bec9d3"/>
              <path d="M54 86H119M54 96H119M54 106H119" stroke="#8598a9" stroke-width="1.6" stroke-linecap="round"/>
              <rect x="135" y="73" width="57" height="46" rx="8" fill="#e45d5d"/>
              <path d="M175 78L185 82V110L175 114Z" fill="#a9cddd" stroke="#d9edf5" stroke-width=".6"/><rect x="151" y="76" width="9" height="40" rx="4" fill="#951a2a" stroke="#ffd4d8"/>
              <path d="M155.5 80V93M155.5 99V112" stroke="#ff8083" stroke-width="4" stroke-linecap="round"/>
            </g>
          </svg>
          <button class="port" data-port="left-rear" type="button" aria-label="車両左後の放口">左後</button>
          <button class="port" data-port="left-front" type="button" aria-label="車両左前の放口">左前</button>
          <button class="port" data-port="right-front" type="button" aria-label="車両右前の放口">右前</button>
          <button class="port" data-port="right-rear" type="button" aria-label="車両右後の放口">右後</button>
          <button id="edit-water-settings" type="button">水利設定</button>
        </div>
        <div class="pump">
          <div class="pressure-readout"><span id="pump-heading">必要吐出圧力（推定）</span><strong class="pressure">— MPa</strong></div>
          <div id="pressure-model-notice" class="alarm" role="status" hidden>計算基準の更新により、旧版の据え置き圧を解除しました。</div>
          <div id="total"></div>
          <div id="supply-estimate" class="hint"></div>
          <details id="pressure-preview" hidden>
            <summary>変更後の必要圧力<span id="pressure-preview-basis"></span> <strong id="pressure-preview-value"></strong> <span id="pressure-preview-warning" class="alarm" role="status"></span></summary>
            <div id="pressure-preview-values"></div>
          </details>
          <div id="alert" class="alarm" role="status"></div>
          <button id="recalculate-pressure" type="button" hidden>圧力再計算</button>
          <button id="respond" type="button" aria-haspopup="dialog" hidden>対応策</button>
        </div>
      </section>
      <section class="lines" id="lines" aria-label="設定済みホースライン"></section>
    </div>
  </main>
  <dialog class="overlay" id="overlay" aria-labelledby="title">
    <div class="editor">
      <header><h2 id="title">設定</h2><button id="close" type="button">閉じる</button></header>
      <div class="options" id="options"></div>
      <footer><button id="delete" type="button" class="delete" hidden>ラインを削除</button><button id="back" type="button">← 戻る</button><span class="hint">選択後、次へ進みます</span></footer>
    </div>
  </dialog>
  <dialog class="overlay" id="response" aria-labelledby="response-title">
    <div class="editor">
      <header><h2 id="response-title">対応策</h2><button id="response-close" type="button">戻る</button></header>
      <p id="response-original"></p>
      <div class="options response-options">
        <p id="response-reference"></p>
        <label>対象筒先 <select id="response-target"></select></label>
        <details><summary>筒先口径の変更</summary><div id="response-diameters"></div></details>
        <details><summary>分岐・放口を絞る</summary><div id="response-throttle"></div></details>
        <label><input type="checkbox"> 関係する筒先へ変更内容を共有</label>
        <label><input type="checkbox"> 変更後に関係する筒先の状態を確認</label>
        <p class="hint" id="response-quadra-note" hidden></p>
      </div>
    </div>
  </dialog>
  <dialog class="overlay" id="water-settings" aria-labelledby="water-settings-title">
    <form class="editor" id="water-settings-form">
      <header><h2 id="water-settings-title">水利設定</h2><button id="water-settings-close" type="button">閉じる</button></header>
      <div class="options response-options">
        <label>水利 <select id="water-source">
          <option value="">未設定・その他</option>
          <option value="hydrant">有圧水利（消火栓）</option>
          <option value="draft">無圧水利</option>
        </select></label>
        <div id="draft-fields" hidden>
          <label>吸水高さ <select id="suction-height"><option value="">未設定</option></select></label>
          <label>水利に投入した吸管 <select id="suction-count">
            <option value="">未設定</option><option value="1">1本</option><option value="2">2本（並列）</option>
          </select></label>
          <p id="suction-count-note" class="hint" role="status" hidden></p>
          <p class="hint">吸水高さは水面からポンプ吸水口まで。直列につないだ吸管は投入1本として扱います。吸管損失と送水能力は実車で確認してください。</p>
        </div>
        <div id="hydrant-fields" hidden>
          <label class="nozzle-ceiling">消火栓の見込給水量（L/min） <input id="hydrant-flow" type="number" inputmode="decimal" min="0" step="any"></label>
          <p class="hint">現場で推定・測定した値を入力。放水中の吸水圧・給水状況は実機で確認してください。</p>
        </div>
      </div>
      <footer><button type="submit">保存</button></footer>
    </form>
  </dialog>
  <script src="./app.js?v=0917"></script>
</body>
</html>
