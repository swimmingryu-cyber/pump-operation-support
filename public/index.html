<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ポンプ運用支援・操作試作 v0.8.4</title><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#0d1929"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="./style.css"></head><body><div class="shell"><div class="top"><strong>🚒 ポンプ運用支援 <span class="small">v0.8.4</span></strong><button id="fullscreen" type="button" hidden>横向き全画面</button><span class="status">⚠ 概算支援・訓練用。実活動では筒先員と連携し、実測値で調整してください。</span></div><div id="screen-hint" class="hint" role="status" hidden></div><div class="main"><div class="panel pump"><div class="waterbar"><span>💧 水利</span><button id="water" style="font-size:15px">無圧</button><button id="backpressure" class="backpressure" style="font-size:15px" title="筒先がポンプより高い高低差の概算">背圧 0m</button></div><div style="font-size:30px">🚒</div><div class="small">概算必要吐出圧力</div><div class="pressure">— MPa</div><div class="small" id="total">設定流量：未確定</div><div class="alarm" id="alert">条件を入力してください</div></div><div class="diagram"><div class="line" id="line0"><button onclick="startMain(0)" id="main0">第1線　設定する</button><button class="stopbtn" id="stop0" onclick="toggleStop(0)" aria-label="第1線の放水停止切替">放水中</button><span class="fork">⑂</span><div class="branches"><div class="branchrow"><button onclick="startBranch(0,0)" id="branch00">筒先A　設定する</button><button class="stopbtn" id="stop00" onclick="toggleBranchStop(0,0)" aria-label="第1線筒先1放水停止切替">放水中</button></div><div class="branchrow"><button onclick="startBranch(0,1)" id="branch01">＋ 筒先Bを追加</button><button class="stopbtn" id="stop01" onclick="toggleBranchStop(0,1)" aria-label="第1線筒先2放水停止切替">放水中</button></div></div></div><div class="line off" id="line1"><button onclick="startMain(1)" id="main1">＋ 第2線を追加</button><button class="stopbtn" id="stop1" onclick="toggleStop(1)" aria-label="第2線の放水停止切替">放水中</button><span class="fork">⑂</span><div class="branches"><div class="branchrow"><button onclick="startBranch(1,0)" id="branch10">筒先A　未使用</button><button class="stopbtn" id="stop10" onclick="toggleBranchStop(1,0)" aria-label="第2線筒先1放水停止切替">放水中</button></div><div class="branchrow"><button onclick="startBranch(1,1)" id="branch11">＋ 筒先Bを追加</button><button class="stopbtn" id="stop11" onclick="toggleBranchStop(1,1)" aria-label="第2線筒先2放水停止切替">放水中</button></div></div></div></div></div><div class="bottom"><span class="small">各線・筒先をタップして再編集／停止は流量ゼロで再計算。概算モデル：摩擦係数0.025・分岐損失0.02MPa・背圧は高低差換算・有圧水利補正なし</span><button onclick="if(confirm('すべての設定を初期化しますか？')){localStorage.removeItem('pump-v083');location.reload()}">初期化</button></div></div><section class="overlay" id="overlay"><header><h2 id="title">設定</h2><button onclick="closeOverlay()" style="padding:0 14px">× 閉じる</button></header><div class="options" id="options"></div><footer><button onclick="back()" id="back">← 前に戻る</button><span class="hint">選択後、自動的に次へ進みます</span></footer></section><script src="./app.js"></script></body></html>
