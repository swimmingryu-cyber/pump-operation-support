<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>消防ポンプ運用支援 v0.8.5</title>
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=085">
</head>
<body>
  <main class="shell" id="main">
    <header class="top">
      <strong>消防ポンプ運用支援 <small>v0.8.5</small></strong>
      <button id="flip" type="button" aria-pressed="false">⇄ 左右反転</button>
      <button id="fullscreen" type="button">横向き全画面</button>
    </header>
    <p class="hint" id="screen-hint" role="status" hidden></p>
    <div class="deck" id="deck">
      <section class="vehicle" aria-label="消防車とポンプ">
        <div class="map" id="map">
          <svg viewBox="0 0 300 192" preserveAspectRatio="none" aria-hidden="true" id="hoses">
            <path data-hose="left-rear" d="M72 61V36Q72 24 86 24H300"/>
            <path data-hose="left-front" d="M144 61V53Q144 45 156 45H300"/>
            <path data-hose="right-front" d="M144 131V139Q144 147 156 147H300"/>
            <path data-hose="right-rear" d="M72 131V156Q72 168 86 168H300"/>
            <g class="pump-truck">
              <rect x="43" y="57" width="38" height="16" rx="4" fill="#09111f"/>
              <rect x="43" y="119" width="38" height="16" rx="4" fill="#09111f"/>
              <rect x="150" y="57" width="35" height="16" rx="4" fill="#09111f"/>
              <rect x="150" y="119" width="35" height="16" rx="4" fill="#09111f"/>
              <rect x="35" y="65" width="166" height="62" rx="12" fill="#c63d42" stroke="#ff9694"/>
              <rect x="47" y="74" width="77" height="44" rx="5" fill="#7b2934"/>
              <path d="M58 84H112M58 92H112M58 100H112M58 108H112" stroke="#e99ea4"/>
              <rect x="133" y="73" width="59" height="46" rx="8" fill="#e75c59"/>
              <path d="M175 78L185 82V110L175 114Z" fill="#b9dcea"/>
              <rect x="141" y="78" width="5" height="36" rx="2" fill="#ffe088"/>
              <path d="M214 91L223 96L214 101Z" fill="#c8e3f6"/>
            </g>
          </svg>
          <button class="port" data-port="left-rear" type="button" aria-label="車両左後の放口">左後</button>
          <button class="port" data-port="left-front" type="button" aria-label="車両左前の放口">左前</button>
          <button class="port" data-port="right-front" type="button" aria-label="車両右前の放口">右前</button>
          <button class="port" data-port="right-rear" type="button" aria-label="車両右後の放口">右後</button>
        </div>
        <div class="pump">
          <div class="waterbar"><span>水利</span><button id="water" type="button">無圧</button><button id="backpressure" type="button">背圧 0m</button></div>
          <div>概算必要吐出圧力 <strong class="pressure">— MPa</strong></div>
          <div id="total"></div><div id="alert" class="alarm" role="status"></div>
        </div>
      </section>
      <section class="lines" id="lines" aria-label="設定済みホースライン"></section>
    </div>
    <footer class="bottom">
      <span>概算支援・訓練用。実活動では筒先員と連携し、実測値で調整してください。</span>
      <button id="reset" type="button">初期化</button>
    </footer>
  </main>
  <dialog class="overlay" id="overlay" aria-labelledby="title">
    <div class="editor">
      <header><h2 id="title">設定</h2><button id="close" type="button">閉じる</button></header>
      <div class="options" id="options"></div>
      <footer><button id="delete" type="button" class="delete" hidden>ラインを削除</button><button id="back" type="button">← 戻る</button><span class="hint">選択後、次へ進みます</span></footer>
    </div>
  </dialog>
  <script src="./app.js?v=085"></script>
</body>
</html>
